<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Caramba Sim — Mô phỏng bi-a 3 băng (event-based)</title>
<style>
  :root{ --green:#16b364; --green-d:#0f9c54; --bg:#eef1f0; --ink:#1d2421; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);}
  .app{max-width:520px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}
  header{background:var(--green); color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; flex:0 0 auto;}
  header h1{font-size:16px; margin:0; font-weight:800;}
  header .ver{font-size:10px; background:rgba(255,255,255,.18); padding:3px 8px; border-radius:10px;}
  .calc{margin:6px 14px 0; display:flex; gap:10px; align-items:center; font-size:12.5px; flex:0 0 auto;}
  .calc .pill{background:#fff8e6; border:1px solid #f0d489; border-radius:10px; padding:4px 10px; font-weight:800;}
  .calc .pill b{color:var(--green-d);}
  .calc .stat{color:#5b6b63; font-weight:700;}
  .stage{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 14px;}
  canvas{max-width:100%; max-height:100%; width:auto; height:auto; aspect-ratio:46/82;
    display:block; border-radius:12px; touch-action:none; box-shadow:0 5px 16px rgba(0,0,0,.14);}
  .controls{padding:6px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; flex:0 0 auto;}
  .row{display:flex; gap:10px; align-items:center;}
  .card{background:#fff; border-radius:12px; padding:8px 10px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .grow{flex:1;}
  label.lbl{font-size:11px; color:#5b6b63; font-weight:700; display:block; margin-bottom:4px;}
  input[type=range]{width:100%; accent-color:var(--green);}
  .english{width:70px; height:70px; position:relative; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #fff, #e7ece9); border:2px solid #cdd6d1; touch-action:none;}
  .english .dot{position:absolute; width:13px; height:13px; border-radius:50%; background:var(--green);
    border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transform:translate(-50%,-50%); left:50%; top:50%;}
  .english .cross::before,.english .cross::after{content:""; position:absolute; background:#d4ddd8;}
  .english .cross::before{left:50%; top:8%; bottom:8%; width:1px; transform:translateX(-.5px);}
  .english .cross::after{top:50%; left:8%; right:8%; height:1px; transform:translateY(-.5px);}
  .english small{position:absolute; bottom:-16px; left:0; right:0; text-align:center; font-size:10px; color:#5b6b63; font-weight:800;}
  .btns{display:flex; gap:10px;}
  button{font:inherit; font-weight:800; border:none; border-radius:11px; padding:11px 14px; cursor:pointer;}
  .shoot{background:var(--green); color:#fff; flex:1;}
  .shoot:active{background:var(--green-d);}
  .ghost{background:#fff; color:var(--green); border:2px solid var(--green); flex:1;}
  .toggle{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:#5b6b63;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎱 Caramba Sim</h1>
    <span class="ver">v1.0 · event-based · Mathavan 2010</span>
  </header>

  <div class="calc">
    <span class="pill">Băng: <b id="bandN">0</b></span>
    <span class="stat" id="status">Kéo từ bi trắng để nhắm</span>
  </div>

  <div class="stage">
    <canvas id="cv" width="460" height="820"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <div class="card grow">
        <label class="lbl">Lực đánh — <span id="pwrVal">55%</span></label>
        <input id="power" type="range" min="5" max="100" value="55">
        <div class="row" style="margin-top:6px; gap:14px;">
          <label class="toggle"><input type="checkbox" id="showGhost" checked> Đường dự đoán</label>
          <label class="toggle"><input type="checkbox" id="showDiamond" checked> Lưới diamond</label>
        </div>
      </div>
      <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:4px;">
        <label class="lbl" style="margin:0;">Điểm chạm cơ</label>
        <div class="english" id="eng">
          <div class="cross"></div>
          <div class="dot" id="engDot"></div>
          <small id="engVal">tâm</small>
        </div>
      </div>
    </div>
    <div class="btns">
      <button class="ghost" id="reset">↺ Đặt lại</button>
      <button class="shoot" id="shoot">Đánh ▸</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script>
(() => {
  const E = window.CarambaEngine;
  const { TABLE, BALL } = E;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  // ---- table <-> canvas mapping (portrait: table length is vertical) ----
  const RAIL = 34;
  const px0 = RAIL, py0 = RAIL, pw = W - RAIL * 2, ph = H - RAIL * 2;
  const S = pw / TABLE.W;                     // px per meter (ph/TABLE.L identical: 2:1)
  const toCanvas = (x, y) => [px0 + x * S, py0 + (TABLE.L - y) * S];
  const toTable = (cx, cy) => [(cx - px0) / S, TABLE.L - (cy - py0) / S];
  const Rpx = BALL.R * S;
  const NX = 4, NY = 8;

  const V0MAX = 6.5;                          // cue speed at 100% (m/s)

  // ---- state ----
  let balls, cue, aim, english = { x: 0, y: 0 };
  let anim = null;                            // {result, t0, mapping of balls}
  let ghost = null;                           // cached prediction

  function mk(x, y, color, name) { const b = E.mkBall(x, y); b.color = color; b.name = name; return b; }
  function reset() {
    balls = [
      mk(TABLE.W * 0.1375, TABLE.L * 0.64375, '#ffffff', 'cue'),
      mk(TABLE.W * 0.1375, TABLE.L * 0.76875, '#f5c518', 'yellow'),
      mk(TABLE.W * 0.2125, TABLE.L * 0.3625, '#e5484d', 'red'),
    ];
    cue = balls[0];
    aim = { phi: Math.PI / 4, power: 0.55 };
    anim = null; ghost = null;
    document.getElementById('bandN').textContent = '0';
    setStatus('Kéo từ bi trắng để nhắm');
    draw();
  }

  // English mapping: UI right (+x) = right english = pooltool a NEGATIVE.
  const MAX_TIP = 0.5;
  function strikeParams() {
    return {
      V0: V0MAX * aim.power,
      a: -english.x * MAX_TIP,
      b: english.y * MAX_TIP,
    };
  }

  function runPrediction() {
    const clones = balls.map(b => ({ ...b }));
    const p = strikeParams();
    E.strike(clones[0], p.V0, aim.phi, p.a, p.b);
    const res = E.simulateShot(clones, { maxEvents: 3000, maxT: 60 });
    // sample paths
    const paths = balls.map(() => []);
    const n = 260;
    for (let k = 0; k <= n; k++) {
      const t = res.duration * k / n;
      for (let i = 0; i < balls.length; i++) {
        const s = res.positionAt(i, t);
        paths[i].push([s.x, s.y]);
      }
    }
    return { paths };
  }

  function shoot() {
    if (anim) return;
    const sim = balls.map(b => ({ ...b }));
    const p = strikeParams();
    E.strike(sim[0], p.V0, aim.phi, p.a, p.b);
    const result = E.simulateShot(sim, { maxEvents: 3000, maxT: 60 });
    anim = { result, start: performance.now() };
    setStatus('Bi đang chạy…');
    requestAnimationFrame(tick);
  }

  function tick(now) {
    if (!anim) return;
    const t = (now - anim.start) / 1000;
    const { result } = anim;
    const tq = Math.min(t, result.duration);
    for (let i = 0; i < balls.length; i++) {
      const s = result.positionAt(i, tq);
      balls[i].x = s.x; balls[i].y = s.y;
    }
    const bands = result.events.filter(e => e.type === 'cushion' && e.i === 0 && e.t <= tq).length;
    document.getElementById('bandN').textContent = bands;
    draw(true);
    if (t < result.duration) requestAnimationFrame(tick);
    else {
      // commit final states
      for (let i = 0; i < balls.length; i++) {
        const s = result.positionAt(i, result.duration);
        Object.assign(balls[i], { x: s.x, y: s.y, vx: 0, vy: 0, wx: 0, wy: 0, wz: 0, state: 0 });
      }
      anim = null; ghost = null;
      setStatus('Xong — ' + bands + ' băng. Đặt lại hoặc đánh tiếp.');
      draw();
    }
  }

  // ---- render ----
  function draw(inFlight = false) {
    ctx.fillStyle = '#2c5e44'; roundRect(0, 0, W, H, 16); ctx.fill();
    ctx.fillStyle = '#1f9d63'; ctx.fillRect(px0, py0, pw, ph);
    const grad = ctx.createLinearGradient(px0, py0, px0, py0 + ph);
    grad.addColorStop(0, 'rgba(255,255,255,.05)'); grad.addColorStop(1, 'rgba(0,0,0,.10)');
    ctx.fillStyle = grad; ctx.fillRect(px0, py0, pw, ph);

    if (document.getElementById('showDiamond').checked) drawDiamonds();

    if (!inFlight && document.getElementById('showGhost').checked) {
      if (!ghost) ghost = runPrediction();
      // object ball paths (faint, their color)
      for (let i = 1; i < balls.length; i++) drawPath(ghost.paths[i], balls[i].color, 0.5, [4, 5]);
      drawPath(ghost.paths[0], 'rgba(255,255,255,.9)', 2, [6, 6]);
    }
    for (const b of balls) drawBall(b);
  }

  function drawPath(pts, color, width, dash) {
    if (!pts || pts.length < 2) return;
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
    ctx.beginPath();
    let [cx0, cy0] = toCanvas(pts[0][0], pts[0][1]);
    ctx.moveTo(cx0, cy0);
    for (const [x, y] of pts) { const [cx, cy] = toCanvas(x, y); ctx.lineTo(cx, cy); }
    ctx.stroke(); ctx.setLineDash([]);
  }

  function drawDiamonds() {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i <= NY; i++) { const y = py0 + i * ph / NY; diamond(RAIL / 2, y); diamond(W - RAIL / 2, y); }
    for (let i = 0; i <= NX; i++) { const x = px0 + i * pw / NX; diamond(x, RAIL / 2); diamond(x, H - RAIL / 2); }
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '10px -apple-system,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= NY; i++) ctx.fillText(i, px0 + 10, py0 + i * ph / NY);
  }
  function diamond(x, y) { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillRect(-3, -3, 6, 6); ctx.restore(); }

  function drawBall(b) {
    const [cx, cy] = toCanvas(b.x, b.y);
    ctx.beginPath(); ctx.arc(cx, cy, Rpx, 0, 7); ctx.fillStyle = b.color; ctx.fill();
    const g = ctx.createRadialGradient(cx - 4, cy - 5, 1, cx, cy, Rpx);
    g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(0,0,0,.18)');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.stroke();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---- input: drag on cue to aim ----
  function canvasPos(e) {
    const rect = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [(t.clientX - rect.left) * (W / rect.width), (t.clientY - rect.top) * (H / rect.height)];
  }
  let dragging = false;
  function down(e) {
    if (anim) return;
    const [mx, my] = canvasPos(e);
    const [bx, by] = toCanvas(cue.x, cue.y);
    if (Math.hypot(mx - bx, my - by) < 70) { dragging = true; e.preventDefault(); move(e); }
  }
  function move(e) {
    if (!dragging) return;
    const [mx, my] = canvasPos(e);
    const [tx, ty] = toTable(mx, my);
    const dx = cue.x - tx, dy = cue.y - ty;
    const d = Math.hypot(dx, dy);
    if (d > 0.015) {
      aim.phi = Math.atan2(dy, dx);
      aim.power = Math.max(0.05, Math.min(1, d / 0.62));
      document.getElementById('power').value = Math.round(aim.power * 100);
      document.getElementById('pwrVal').textContent = Math.round(aim.power * 100) + '%';
      ghost = null;
    }
    draw(); e.preventDefault();
  }
  function up() { dragging = false; }
  cv.addEventListener('mousedown', down); cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down, { passive: false });
  cv.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);

  // ---- english picker ----
  const eng = document.getElementById('eng'), engDot = document.getElementById('engDot'), engVal = document.getElementById('engVal');
  function setEnglish(cx, cy) {
    const rect = eng.getBoundingClientRect();
    let x = (cx - rect.left) / rect.width * 2 - 1, y = (cy - rect.top) / rect.height * 2 - 1;
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    english.x = x; english.y = -y;
    engDot.style.left = (50 + x * 42) + '%'; engDot.style.top = (50 + y * 42) + '%';
    let tag = 'tâm';
    if (m >= 0.12) {
      const parts = [];
      if (english.y > 0.2) parts.push('follow'); else if (english.y < -0.2) parts.push('draw');
      if (english.x > 0.2) parts.push('phải'); else if (english.x < -0.2) parts.push('trái');
      tag = parts.join(' ') || 'tâm';
    }
    engVal.textContent = tag; ghost = null; draw();
  }
  let engDrag = false;
  const ev = e => { const t = e.touches ? e.touches[0] : e; return [t.clientX, t.clientY]; };
  eng.addEventListener('mousedown', e => { engDrag = true; setEnglish(...ev(e)); });
  window.addEventListener('mousemove', e => { if (engDrag) setEnglish(...ev(e)); });
  window.addEventListener('mouseup', () => engDrag = false);
  eng.addEventListener('touchstart', e => { engDrag = true; setEnglish(...ev(e)); e.preventDefault(); }, { passive: false });
  eng.addEventListener('touchmove', e => { if (engDrag) { setEnglish(...ev(e)); e.preventDefault(); } }, { passive: false });
  window.addEventListener('touchend', () => engDrag = false);

  // ---- controls ----
  document.getElementById('power').addEventListener('input', e => {
    aim.power = e.target.value / 100;
    document.getElementById('pwrVal').textContent = e.target.value + '%';
    ghost = null; draw();
  });
  document.getElementById('shoot').addEventListener('click', shoot);
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('showGhost').addEventListener('change', () => draw());
  document.getElementById('showDiamond').addEventListener('change', () => draw());
  function setStatus(t) { document.getElementById('status').textContent = t; }

  reset();
})();
</script>
</body>
</html>
