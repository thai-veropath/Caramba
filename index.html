<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Caramba Sim — Mô phỏng bi-a 3 băng</title>
<style>
  :root{ --green:#16b364; --green-d:#0f9c54; --bg:#eef1f0; --ink:#1d2421; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);}
  .app{max-width:520px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}
  header{background:var(--green); color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; flex:0 0 auto;}
  header h1{font-size:16px; margin:0; font-weight:800;}
  header .ver{font-size:10px; background:rgba(255,255,255,.18); padding:3px 8px; border-radius:10px;}
  .calc{margin:6px 14px 0; display:flex; gap:10px; align-items:center; font-size:12.5px; flex:0 0 auto;}
  .calc .pill{background:#fff8e6; border:1px solid #f0d489; border-radius:10px; padding:4px 10px; font-weight:800;}
  .calc .pill b{color:var(--green-d);}
  .calc .stat{color:#5b6b63; font-weight:700;}
  .stage{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 14px;}
  canvas{max-width:100%; max-height:100%; width:auto; height:auto; aspect-ratio:46/82;
    display:block; border-radius:12px; touch-action:none; box-shadow:0 5px 16px rgba(0,0,0,.14);}
  .controls{padding:6px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; flex:0 0 auto;}
  .row{display:flex; gap:10px; align-items:center;}
  .card{background:#fff; border-radius:12px; padding:8px 10px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .grow{flex:1;}
  label.lbl{font-size:11px; color:#5b6b63; font-weight:700; display:block; margin-bottom:4px;}
  input[type=range]{width:100%; accent-color:var(--green);}
  .english{width:70px; height:70px; position:relative; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #fff, #e7ece9); border:2px solid #cdd6d1; touch-action:none;}
  .english .dot{position:absolute; width:13px; height:13px; border-radius:50%; background:var(--green);
    border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transform:translate(-50%,-50%); left:50%; top:50%;}
  .english .cross::before,.english .cross::after{content:""; position:absolute; background:#d4ddd8;}
  .english .cross::before{left:50%; top:8%; bottom:8%; width:1px; transform:translateX(-.5px);}
  .english .cross::after{top:50%; left:8%; right:8%; height:1px; transform:translateY(-.5px);}
  .english small{position:absolute; bottom:-16px; left:0; right:0; text-align:center; font-size:10px; color:#5b6b63; font-weight:800;}
  .btns{display:flex; gap:10px;}
  button{font:inherit; font-weight:800; border:none; border-radius:11px; padding:11px 14px; cursor:pointer;}
  .shoot{background:var(--green); color:#fff; flex:1;}
  .shoot:active{background:var(--green-d);}
  .ghost{background:#fff; color:var(--green); border:2px solid var(--green); flex:1;}
  .toggle{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:#5b6b63;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎱 Caramba Sim</h1>
    <span class="ver">v0.6 · Han 2005 cushion</span>
  </header>

  <div class="calc">
    <span class="pill">Băng: <b id="bandN">0</b></span>
    <span class="stat" id="status">Kéo từ bi trắng để nhắm</span>
  </div>

  <div class="stage">
    <canvas id="cv" width="460" height="820"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <div class="card grow">
        <label class="lbl">Lực đánh — <span id="pwrVal">55%</span></label>
        <input id="power" type="range" min="8" max="100" value="55">
        <div class="row" style="margin-top:6px; gap:14px;">
          <label class="toggle"><input type="checkbox" id="showGhost" checked> Đường dự đoán</label>
          <label class="toggle"><input type="checkbox" id="showDiamond" checked> Lưới diamond</label>
        </div>
      </div>
      <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:4px;">
        <label class="lbl" style="margin:0;">Điểm chạm cơ</label>
        <div class="english" id="eng">
          <div class="cross"></div>
          <div class="dot" id="engDot"></div>
          <small id="engVal">tâm</small>
        </div>
      </div>
    </div>
    <div class="btns">
      <button class="ghost" id="reset">↺ Đặt lại</button>
      <button class="shoot" id="shoot">Đánh ▸</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  // ================= TABLE (carom 3-cushion, 2:1, no pockets) =================
  const RAIL = 34;
  const px0 = RAIL, py0 = RAIL, pw = W - RAIL*2, ph = H - RAIL*2;
  const R = 11;                                   // ball radius (px)
  const L = px0+R, Rt = px0+pw-R, T = py0+R, B = py0+ph-R;   // center bounds
  const NX = 4, NY = 8;
  const ux = u => px0 + (u/NX)*pw;
  const uy = v => py0 + (v/NY)*ph;

  // ================= PHYSICS ENGINE (validated) =================
  // Each ball: linear velocity (vx,vy) + angular velocity (wx,wy,wz) rad/s.
  // wx,wy = horizontal spin (follow/draw/roll), wz = vertical spin (english).
  const SLIDE_DECEL = 1800;   // cloth sliding friction (px/s^2)
  const ROLL_DECEL  = 400;    // rolling resistance (px/s^2) — tuned: 100% ≈ 8-10 bands
  const SPIN_DECEL  = 6.0;    // vertical-spin decay on cloth (rad/s^2)
  const SLIP_EPS    = 6;      // contact slip below which ball is "rolling"
  const ROLL_STOP   = 4;      // speed below which ball stops
  const E_C         = 0.92;   // Han cushion restitution
  const F_C         = 0.20;   // Han cushion friction (ball–rail)
  const H_RATIO     = 1.28;   // cushion height / R  (≈ 0.64 · ball diameter)
  const BALL_E      = 0.95;   // ball-ball restitution
  const BALL_FRIC   = 0.10;   // inter-ball friction (throw)
  const MAXTIP      = 0.35;   // max usable tip offset (fraction of R) — miscue limit
  const Vmax        = 6000;   // cue speed at 100% power (px/s)

  function strike(b, angle, power, tipX, tipY){
    const v0 = Vmax*power, dx = Math.cos(angle), dy = Math.sin(angle);
    b.vx = v0*dx; b.vy = v0*dy;
    const lx = -dy, ly = dx;                       // "left of travel" unit
    const A = tipX*MAXTIP, Bt = tipY*MAXTIP;       // tip offsets (fraction of R)
    const wtop = (5/2)*(v0/R)*Bt;                  // follow(+) / draw(-)
    b.wx = wtop*lx; b.wy = wtop*ly;
    b.wz = (5/2)*(v0/R)*A;                         // sidespin (english)
  }

  function stepBall(b, dt){
    // contact-point slip:  u = v + w x (-R z)
    const uxx = b.vx - R*b.wy, uyy = b.vy + R*b.wx;
    const us = Math.hypot(uxx, uyy);
    if(us > SLIP_EPS){                             // SLIDING: kinetic friction opposes slip
      const fx = -SLIDE_DECEL*uxx/us, fy = -SLIDE_DECEL*uyy/us;
      b.vx += fx*dt; b.vy += fy*dt;
      b.wx += (5/(2*R))*fy*dt;
      b.wy += (5/(2*R))*(-fx)*dt;
    } else {                                       // ROLLING
      const sp = Math.hypot(b.vx, b.vy);
      if(sp > ROLL_STOP){ const nf = Math.max(0, sp-ROLL_DECEL*dt); b.vx*=nf/sp; b.vy*=nf/sp; }
      else { b.vx=0; b.vy=0; }
      b.wy = b.vx/R; b.wx = -b.vy/R;               // slave spin to pure roll
    }
    if(b.wz>0) b.wz = Math.max(0, b.wz-SPIN_DECEL*dt);
    else if(b.wz<0) b.wz = Math.min(0, b.wz+SPIN_DECEL*dt);
    b.x += b.vx*dt; b.y += b.vy*dt;
    return cushion(b);
  }

  // Han (2005) "Dynamics in carom and three-cushion billiards" — ball–cushion
  // impulse model, ported from pooltool (mass- & scale-independent, so px units OK).
  // Accounts for the rail contacting the ball ABOVE its centre (height ≈ 0.64·diam),
  // which is what makes rebound angle depend on speed and side-spin (real english).
  function hanCushion(b, nx, ny){
    if(b.vx*nx + b.vy*ny <= 0) return;             // already moving away from rail
    const psi = Math.atan2(ny, nx);                // rotate into cushion frame (normal → +x)
    const c1 = Math.cos(-psi), s1 = Math.sin(-psi);
    let vx = c1*b.vx - s1*b.vy, vy = s1*b.vx + c1*b.vy, vz = 0;
    let wx = c1*b.wx - s1*b.wy, wy = s1*b.wx + c1*b.wy, wz = b.wz;
    const th = Math.asin(H_RATIO-1), sT = Math.sin(th), cT = Math.cos(th);
    const sx = vx*sT - vz*cT + R*wy;               // Eq.14 — slip velocity at contact
    const sy = -vy - R*wz*cT + R*wx*sT;
    const cc = -vx*cT;
    const II = 2/5*R*R, A = 7/2;                    // moment of inertia, 7/2m  (m = 1)
    const PzE = -(1+E_C)*cc;                        // Eq.17 — normal (restitution) impulse
    const s0 = Math.hypot(sx, sy);
    let PxE, PyE;
    if(s0/A <= F_C*PzE){ PxE = sx/A; PyE = sy/A; }          // Eq.18 stick
    else { PxE = F_C*PzE*sx/s0; PyE = F_C*PzE*sy/s0; }      // Eq.19 slide
    const PX = -PxE*sT - PzE*cT, PY = PyE, PZ = PxE*cT - PzE*sT;  // Eq.21-22
    vx += PX; vy += PY;                            // Eq.23 (m = 1)
    wx += -R/II*PY*sT; wy += R/II*(PX*sT - PZ*cT); wz += R/II*PY*cT;
    const c2 = Math.cos(psi), s2 = Math.sin(psi);  // rotate back to table frame
    b.vx = c2*vx - s2*vy; b.vy = s2*vx + c2*vy;
    b.wx = c2*wx - s2*wy; b.wy = s2*wx + c2*wy; b.wz = wz;
  }
  function cushion(b){
    let hit = 0;
    if(b.x < L){ b.x=L; hanCushion(b,-1,0); hit=1; }
    else if(b.x > Rt){ b.x=Rt; hanCushion(b,1,0); hit=1; }
    if(b.y < T){ b.y=T; hanCushion(b,0,-1); hit=1; }
    else if(b.y > B){ b.y=B; hanCushion(b,0,1); hit=1; }
    return hit;
  }

  function collide(a, c){
    const dx = c.x-a.x, dy = c.y-a.y, d = Math.hypot(dx,dy);
    if(d===0 || d>=2*R) return false;
    const nx = dx/d, ny = dy/d, tx = -ny, ty = nx;
    const ov = 2*R-d; a.x-=nx*ov/2; a.y-=ny*ov/2; c.x+=nx*ov/2; c.y+=ny*ov/2;
    const rvx = c.vx-a.vx, rvy = c.vy-a.vy, vn = rvx*nx+rvy*ny;
    if(vn > 0) return true;
    const jn = -(1+BALL_E)*vn/2;                   // normal impulse (equal mass)
    a.vx-=jn*nx; a.vy-=jn*ny; c.vx+=jn*nx; c.vy+=jn*ny;
    const slipT = (rvx*tx+rvy*ty) - R*(a.wz + c.wz);   // tangential surface slip (throw)
    let jt = -(2/7)*slipT;
    const cap = BALL_FRIC*Math.abs(jn)*3.5;
    jt = Math.max(-cap, Math.min(cap, jt));
    a.vx-=jt*tx; a.vy-=jt*ty; c.vx+=jt*tx; c.vy+=jt*ty;
    a.wz-=(5/(2*R))*jt; c.wz-=(5/(2*R))*jt;
    return true;
  }

  const spd = b => Math.hypot(b.vx, b.vy);

  // ================= STATE =================
  let balls, cue, aim, english = {x:0, y:0}, running = false, bandCount = 0;

  function mk(x,y,color,name){ return {x:ux(x),y:uy(y),vx:0,vy:0,wx:0,wy:0,wz:0,color,name}; }
  function reset(){
    balls = [
      mk(0.55, 5.05, '#ffffff', 'cue'),
      mk(0.55, 4.05, '#f5c518', 'yellow'),
      mk(0.85, 7.30, '#e5484d', 'red'),
    ];
    cue = balls[0];
    aim = {angle:-Math.PI/4, power:0.55};
    running = false; bandCount = 0;
    document.getElementById('bandN').textContent = '0';
    setStatus('Kéo từ bi trắng để nhắm');
    draw();
  }

  function shoot(){
    if(running) return;
    strike(cue, aim.angle, aim.power, english.x, english.y);
    running = true; bandCount = 0;
    document.getElementById('bandN').textContent = '0';
    setStatus('Bi đang lăn…');
    last = performance.now();
    requestAnimationFrame(loop);
  }

  let last = 0;
  function loop(t){
    let dt = (t-last)/1000; last = t; if(dt>0.033) dt = 0.033;
    const sub = 6;
    for(let s=0; s<sub; s++){
      const h = dt/sub;
      for(const b of balls){ const hit = stepBall(b, h); if(b===cue && hit) bumpBand(); }
      for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++) collide(balls[i], balls[j]);
    }
    draw();
    if(balls.some(b=>spd(b)>ROLL_STOP)) requestAnimationFrame(loop);
    else { running=false; setStatus('Xong — '+bandCount+' băng. Đặt lại để đánh tiếp.'); }
  }
  function bumpBand(){ bandCount++; document.getElementById('bandN').textContent = bandCount; }

  // ================= PREDICTED PATH (cue only, same physics) =================
  function predict(){
    const p = {x:cue.x, y:cue.y, vx:0, vy:0, wx:0, wy:0, wz:0};
    strike(p, aim.angle, aim.power, english.x, english.y);
    const pts = [{x:p.x,y:p.y}]; const dt = 1/240;
    for(let i=0; i<2600; i++){
      stepBall(p, dt);
      let stop=false;
      for(const b of balls){ if(b===cue) continue;
        if(Math.hypot(b.x-p.x, b.y-p.y) < 2*R){ stop=true; break; } }
      if(i%3===0 || stop) pts.push({x:p.x,y:p.y});
      if(stop || spd(p)<ROLL_STOP) break;
    }
    return pts;
  }

  // ================= RENDER =================
  function draw(){
    ctx.fillStyle = '#2c5e44'; roundRect(0,0,W,H,16); ctx.fill();
    ctx.fillStyle = '#1f9d63'; ctx.fillRect(px0,py0,pw,ph);
    const g = ctx.createLinearGradient(px0,py0,px0,py0+ph);
    g.addColorStop(0,'rgba(255,255,255,.05)'); g.addColorStop(1,'rgba(0,0,0,.10)');
    ctx.fillStyle = g; ctx.fillRect(px0,py0,pw,ph);

    if(document.getElementById('showDiamond').checked) drawDiamonds();

    if(document.getElementById('showGhost').checked && !running){
      const pts = predict();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for(const q of pts) ctx.lineTo(q.x, q.y);
      ctx.stroke(); ctx.setLineDash([]);
    }
    for(const b of balls) drawBall(b);
  }

  function drawDiamonds(){
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for(let i=0;i<=NY;i++){ const y=uy(i); diamond(RAIL/2,y); diamond(W-RAIL/2,y); }
    for(let i=0;i<=NX;i++){ const x=ux(i); diamond(x,RAIL/2); diamond(x,H-RAIL/2); }
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='10px -apple-system,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<=NY;i++) ctx.fillText(i, px0+10, uy(i));
  }
  function diamond(x,y){ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4); ctx.fillRect(-3,-3,6,6); ctx.restore(); }

  function drawBall(b){
    ctx.beginPath(); ctx.arc(b.x,b.y,R,0,7); ctx.fillStyle=b.color; ctx.fill();
    const g = ctx.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,R);
    g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(0,0,0,.18)');
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.stroke();
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // ================= INPUT: drag on cue to aim =================
  function canvasPos(e){
    const rect = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:(t.clientX-rect.left)*(W/rect.width), y:(t.clientY-rect.top)*(H/rect.height)};
  }
  let dragging=false;
  function down(e){ if(running) return; const p=canvasPos(e);
    if(Math.hypot(p.x-cue.x,p.y-cue.y) < 70){ dragging=true; e.preventDefault(); move(e); } }
  function move(e){ if(!dragging) return; const p=canvasPos(e);
    const dx=cue.x-p.x, dy=cue.y-p.y, d=Math.hypot(dx,dy);
    if(d>4){ aim.angle=Math.atan2(dy,dx); aim.power=Math.max(0.08,Math.min(1,d/170));
      document.getElementById('power').value=Math.round(aim.power*100);
      document.getElementById('pwrVal').textContent=Math.round(aim.power*100)+'%'; }
    draw(); e.preventDefault(); }
  function up(){ dragging=false; }
  cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);

  // ================= ENGLISH PICKER =================
  const eng=document.getElementById('eng'), engDot=document.getElementById('engDot'), engVal=document.getElementById('engVal');
  function setEnglish(cx,cy){
    const rect=eng.getBoundingClientRect();
    let x=(cx-rect.left)/rect.width*2-1, y=(cy-rect.top)/rect.height*2-1;
    const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;}
    english.x=x; english.y=-y;                      // up = follow(+)
    engDot.style.left=(50+x*42)+'%'; engDot.style.top=(50+y*42)+'%';
    let tag='tâm';
    if(m>=0.12){ const parts=[];
      if(english.y>0.2) parts.push('follow'); else if(english.y<-0.2) parts.push('draw');
      if(english.x>0.2) parts.push('phải'); else if(english.x<-0.2) parts.push('trái');
      tag = parts.join(' ') || 'tâm'; }
    engVal.textContent=tag; draw();
  }
  let engDrag=false; const ev=e=>{const t=e.touches?e.touches[0]:e; return [t.clientX,t.clientY];};
  eng.addEventListener('mousedown',e=>{engDrag=true;setEnglish(...ev(e));});
  window.addEventListener('mousemove',e=>{if(engDrag)setEnglish(...ev(e));});
  window.addEventListener('mouseup',()=>engDrag=false);
  eng.addEventListener('touchstart',e=>{engDrag=true;setEnglish(...ev(e));e.preventDefault();},{passive:false});
  eng.addEventListener('touchmove',e=>{if(engDrag){setEnglish(...ev(e));e.preventDefault();}},{passive:false});
  window.addEventListener('touchend',()=>engDrag=false);

  // ================= CONTROLS =================
  document.getElementById('power').addEventListener('input',e=>{
    aim.power=e.target.value/100; document.getElementById('pwrVal').textContent=e.target.value+'%'; draw();});
  document.getElementById('shoot').addEventListener('click',shoot);
  document.getElementById('reset').addEventListener('click',reset);
  document.getElementById('showGhost').addEventListener('change',draw);
  document.getElementById('showDiamond').addEventListener('change',draw);
  function setStatus(t){ document.getElementById('status').textContent=t; }

  reset();
})();
</script>
</body>
</html>
